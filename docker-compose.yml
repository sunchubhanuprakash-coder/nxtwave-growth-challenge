version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nxtwave_growth_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - APP_NAME=NxtWave AI Growth Engine
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/growth_engine.db
      - ALLOWED_ORIGINS=["http://localhost","http://localhost:80","http://localhost:5173","http://127.0.0.1:8000","http://127.0.0.1:5173"]
      - AI_PROVIDER=deterministic_fallback
      - CAMPAIGN_TARGET_REGISTRATIONS=500
      - CAMPAIGN_BUDGET_INR=2000
      - CAMPAIGN_DURATION_DAYS=7
      - SECRET_KEY=replace_with_a_secure_random_production_secret_key_64_chars
      - ADMIN_API_KEY=replace_with_a_secure_production_admin_key_32_chars
    volumes:
      - growth_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - growth_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nxtwave_growth_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - growth_network

volumes:
  growth_data:
    name: nxtwave_growth_data

networks:
  growth_network:
    name: nxtwave_growth_network
    driver: bridge
